dependencies:
  idf: ">=5.3"
  espressif/esp_websocket_client: "^1.2.3"
  # ES8311 / ES7210 / AW88298 codecs on boards that use them
  espressif/esp_codec_dev: "~1.5"
  espressif/esp_lcd_ili9341: "^2.1.0"
  espressif/esp_lcd_touch_tt21100: "^1"
  espressif/esp_lcd_touch_gt911: "^1"
  espressif/esp_lcd_touch_ft5x06: "^1"
  # The ESP32-C6 board is one app of the esp32-playground multi-app platform:
  # launcher client, shared flash layout and the platform_app_slot() build helper.
  mfellner/app_switch:
    git: https://github.com/mfellner/esp32-playground.git
    path: components/app_switch
    version: v0.1.0
    rules:
      - if: "target in [esp32c6]"
